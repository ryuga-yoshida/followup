<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5f6368"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d93025"/></marker>
  </defs>
  <rect width="1440" height="940" fill="#fff"/>

  <!-- ===== 上段: 構成図 ===== -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#202124">システム構成</text>

  <!-- Google Cloud 枠 -->
  <rect x="300" y="64" width="1100" height="330" rx="14" fill="#f8f9fa" stroke="#dadce0" stroke-width="2"/>
  <text x="320" y="92" font-size="15" font-weight="700" fill="#5f6368" letter-spacing=".08em">GOOGLE CLOUD</text>

  <!-- 入力 -->
  <g font-size="16" fill="#202124">
    <rect x="40" y="90" width="210" height="52" rx="10" fill="#e8f0fe" stroke="#aecbfa"/><text x="145" y="114" text-anchor="middle">会議（音声）</text><text x="145" y="133" text-anchor="middle" font-size="12.5" fill="#5f6368">自作の会議室</text>
  </g>
  <g font-size="16" fill="#202124">
    <rect x="40" y="152" width="210" height="46" rx="10" fill="#e8f0fe" stroke="#aecbfa"/><text x="145" y="180" text-anchor="middle">チャット</text>
    <rect x="40" y="208" width="210" height="46" rx="10" fill="#e8f0fe" stroke="#aecbfa"/><text x="145" y="236" text-anchor="middle">メール</text>
    <rect x="40" y="264" width="210" height="46" rx="10" fill="#e8f0fe" stroke="#aecbfa"/><text x="145" y="292" text-anchor="middle">Wiki</text>
    <rect x="40" y="320" width="210" height="52" rx="10" fill="#fef7e0" stroke="#fdd663"/><text x="145" y="344" text-anchor="middle">成果物</text><text x="145" y="363" text-anchor="middle" font-size="12.5" fill="#5f6368">Excel / Word の版管理</text>
  </g>
  <path d="M250 116 H276 V231 M250 175 H276 M250 231 H276 M250 287 H276 V231 M250 346 H276 V231" fill="none" stroke="#9aa0a6" stroke-width="2.5"/>
  <line x1="276" y1="231" x2="332" y2="231" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Cloud Run -->
  <rect x="344" y="150" width="230" height="170" rx="12" fill="#fff" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="459" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">Cloud Run</text>
  <text x="459" y="212" text-anchor="middle" font-size="14" fill="#3c4043">Python / FastAPI</text>
  <line x1="364" y1="228" x2="554" y2="228" stroke="#e8eaed" stroke-width="2"/>
  <text x="459" y="254" text-anchor="middle" font-size="14" fill="#3c4043">正規化：全ソースを</text>
  <text x="459" y="276" text-anchor="middle" font-size="14" fill="#3c4043">1 種類の Event に変換</text>
  <text x="459" y="302" text-anchor="middle" font-size="13" fill="#5f6368">60 秒巡回＋イベント即時起動</text>

  <!-- 統合グラフ -->
  <line x1="574" y1="231" x2="624" y2="231" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="636" y="150" width="230" height="170" rx="12" fill="#fff" stroke="#1a73e8" stroke-width="2.5"/>
  <text x="751" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#202124">統合グラフ</text>
  <text x="751" y="212" text-anchor="middle" font-size="14" fill="#3c4043">SQLite 1 ファイル</text>
  <text x="751" y="240" text-anchor="middle" font-size="14" fill="#3c4043">決定 ─ タスク ─ 発言</text>
  <text x="751" y="262" text-anchor="middle" font-size="14" fill="#3c4043">─ 成果物の変更</text>
  <text x="751" y="290" text-anchor="middle" font-size="13" fill="#5f6368">増分処理・埋め込み</text>

  <!-- Cloud Storage -->
  <line x1="751" y1="320" x2="751" y2="346" stroke="#9aa0a6" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="636" y="346" width="230" height="36" rx="8" fill="#e6f4ea" stroke="#81c995"/>
  <text x="751" y="370" text-anchor="middle" font-size="14" fill="#137333">Cloud Storage（定期退避・復元）</text>

  <!-- 矛盾検知 -->
  <line x1="866" y1="231" x2="916" y2="231" stroke="#d93025" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="928" y="120" width="300" height="244" rx="12" fill="#fce8e6" stroke="#f28b82" stroke-width="2.5"/>
  <text x="1078" y="154" text-anchor="middle" font-size="18" font-weight="700" fill="#c5221f">決定と成果物の照合</text>
  <g font-size="14.5" fill="#3c4043">
    <text x="950" y="188">① 候補の絞り込み（プログラム）</text>
    <text x="950" y="215">② 時系列ガード（プログラム）</text>
    <text x="950" y="242">③ 判定のみ Gemini Pro</text>
    <text x="950" y="269">④ confidence で自動振り分け</text>
  </g>
  <text x="950" y="300" font-size="14" font-weight="700" fill="#c5221f">0.8 以上＝通知 ／ 0.5 以上＝確認</text>
  <text x="950" y="322" font-size="14" font-weight="700" fill="#c5221f">0.5 未満＝無視</text>
  <text x="950" y="344" font-size="13" fill="#5f6368">書き込みは人が承認してから</text>

  <!-- Gemini API -->
  <rect x="1252" y="150" width="130" height="170" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="1317" y="196" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">Gemini</text>
  <text x="1317" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#1a73e8">API</text>
  <text x="1317" y="252" text-anchor="middle" font-size="12.5" fill="#5f6368">Pro</text>
  <text x="1317" y="272" text-anchor="middle" font-size="12.5" fill="#5f6368">Flash</text>
  <text x="1317" y="292" text-anchor="middle" font-size="12.5" fill="#5f6368">embedding</text>
  <line x1="1228" y1="231" x2="1248" y2="231" stroke="#5f6368" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M459 150 V120 H1317 V146" fill="none" stroke="#aecbfa" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ===== 下段: 表 ===== -->
  <text x="40" y="452" font-size="22" font-weight="700" fill="#202124">使用した Google Cloud プロダクト</text>

  <g font-size="15">
    <!-- ヘッダ -->
    <rect x="40" y="472" width="1360" height="42" fill="#f1f3f4"/>
    <text x="60" y="499" font-weight="700" fill="#3c4043">プロダクト</text>
    <text x="330" y="499" font-weight="700" fill="#3c4043">用途</text>
    <text x="900" y="499" font-weight="700" fill="#3c4043">構成・補足</text>

    <g fill="#202124">
      <rect x="40" y="514" width="1360" height="52" fill="#fff"/><line x1="40" y1="566" x2="1400" y2="566" stroke="#e8eaed"/>
      <text x="60" y="546" font-weight="700" fill="#1a73e8">Cloud Run</text>
      <text x="330" y="546">アプリケーションの実行</text>
      <text x="900" y="546" fill="#5f6368">Python / FastAPI・最小インスタンス 0・ソースからデプロイ</text>

      <rect x="40" y="566" width="1360" height="52" fill="#fafafa"/><line x1="40" y1="618" x2="1400" y2="618" stroke="#e8eaed"/>
      <text x="60" y="598" font-weight="700" fill="#1a73e8">Gemini API</text>
      <text x="330" y="598">会議音声の文字起こし</text>
      <text x="900" y="598" fill="#5f6368">gemini-2.5-flash・responseSchema による構造化出力</text>

      <rect x="40" y="618" width="1360" height="52" fill="#fff"/><line x1="40" y1="670" x2="1400" y2="670" stroke="#e8eaed"/>
      <text x="60" y="650" font-weight="700" fill="#1a73e8">Gemini API</text>
      <text x="330" y="650">決定・タスクの抽出、議事録、Wiki の構造化</text>
      <text x="900" y="650" fill="#5f6368">gemini-3.6-flash・呼び出し回数の多い処理を担当</text>

      <rect x="40" y="670" width="1360" height="52" fill="#fafafa"/><line x1="40" y1="722" x2="1400" y2="722" stroke="#e8eaed"/>
      <text x="60" y="702" font-weight="700" fill="#1a73e8">Gemini API</text>
      <text x="330" y="702">決定と成果物の矛盾判定</text>
      <text x="900" y="702" fill="#5f6368">gemini-3.1-pro・絞り込み後の 1 組のみに使用</text>

      <rect x="40" y="722" width="1360" height="52" fill="#fff"/><line x1="40" y1="774" x2="1400" y2="774" stroke="#e8eaed"/>
      <text x="60" y="754" font-weight="700" fill="#1a73e8">Gemini Embedding</text>
      <text x="330" y="754">関連する決定・タスクの絞り込み</text>
      <text x="900" y="754" fill="#5f6368">gemini-embedding-001（3072 次元）・コサイン類似度で候補抽出</text>

      <rect x="40" y="774" width="1360" height="52" fill="#fafafa"/><line x1="40" y1="826" x2="1400" y2="826" stroke="#e8eaed"/>
      <text x="60" y="806" font-weight="700" fill="#137333">Cloud Storage</text>
      <text x="330" y="806">DB・成果物の退避と復元</text>
      <text x="900" y="806" fill="#5f6368">2 分ごとに tar.gz で保存・インスタンス起動時に復元</text>

      <rect x="40" y="826" width="1360" height="52" fill="#fff"/><line x1="40" y1="878" x2="1400" y2="878" stroke="#e8eaed"/>
      <text x="60" y="858" font-weight="700" fill="#137333">Cloud DNS</text>
      <text x="330" y="858">独自ドメインの割り当て</text>
      <text x="900" y="858" fill="#5f6368">agent.leadus-nova.com</text>

      <rect x="40" y="878" width="1360" height="52" fill="#fafafa"/>
      <text x="60" y="910" font-weight="700" fill="#137333">Secret Manager</text>
      <text x="330" y="910">認証情報の管理</text>
      <text x="900" y="910" fill="#5f6368">API キー・セッション鍵・デモ用パスワード</text>
    </g>
  </g>
</svg>
